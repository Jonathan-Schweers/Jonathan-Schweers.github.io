        #popup-container {

            border-top-right-radius: 10px;
            border-top-left-radius: 10px;
            top: 100px;
            left: 10px;
            right: 10px;
            height: calc(100vh - 110px);
            resize: both;
        }

        #popup h1 {

            font-weight: 500;
            margin: 0;
            padding: 0 42.5px;

            filter: opacity(1);
        }

        /* New styling for the iframe background */
.iframe-background {
    position: fixed;
    top: 60px;
    left: 300px;
    width: calc(100vw - 325px);
    height: calc(100vh - 175px);
    border-radius: 5px;
    border-bottom-right-radius: 15px;
    
    /* Reusing .filler logic */
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    background-color: rgba(27, 29, 42, 0.9);
    outline: 2px solid rgb(32, 36, 52);
    box-shadow: 0px 5px 5px -2px rgba(0,0,0,0.2), 0px 3px 4px 0px rgba(0,0,0,0.14), 0px 1px 8px 0px rgba(0,0,0,0.12);
    
    z-index: 0; /* Keep it behind the iframe */
}

.iframe-background img {
    width: 60%; /* Adjust size of the filler cube */
    opacity: 0.5; /* Optional: makes it look more like a background watermark */
}

/* Ensure the iframe sits on top of the background */
#popup-iframe {
    z-index: 1;
}

        #close {

    }
        .grid-item img {
            vertical-align: middle;
            max-width: 100%;

        .filler {

        #max, #rows, #fill {

        .grid-item:hover .open {

            pointer-events: fill;

            height: 60px;
            visibility: hidden;
        }

            height: auto;
        }

        .open:hover img {
            filter: brightness(100);
        }

    <div class="grid-container" data-grid-number="1">
        <div class="grid-item"><img class="content" src="fridgeHinge.png">
            <button class="open" type="button"
                data-name="Scharnier Teil"
                data-text="<p>Mein erstes CAD Modell.<p>"
                data-link="https://gmail6314467.autodesk360.com/shares/public/SH28cd1QT2badd0ea72bdcd0cd0eb402fe16?mode=embed">
                <animated-cube></animated-cube>
            </button>
        </div>
    </div>



    <script>
        function calculateMaxImages() {
            let maxImages = 0;
            let rows = [];
            document.querySelectorAll('.grid-container').forEach(grid => {
                const items = grid.querySelectorAll('.grid-item');
                let rowItems = [];
                let rowTop = null;
                for (let i = 0; i < items.length; i++) {
                    const rect = items[i].getBoundingClientRect();
                    if (rowTop === null || rect.top === rowTop) {
                        rowItems.push(items[i]);
                        rowTop = rect.top;
                    } else {
                        rows.push(rowItems);
                        rowItems = [items[i]];
                        rowTop = rect.top;
                    }
                }
                rows.push(rowItems); // Add the last row
                maxImages = Math.max(maxImages, rowItems.length);
            });
            return { maxImages, rows };
        }

        window.onload = function () {
            updateMaxImages();
            window.addEventListener('resize', updateMaxImages);
        }

        function updateMaxImages() {
            const { maxImages, rows } = calculateMaxImages();
            const fill = rows.map(row => maxImages - row.length);
            //document.getElementById('max').textContent = `Max: ${maxImages}`;
            //document.getElementById('rows').textContent = `Rows: ${rows.map(row => row.length).join(', ')}`;
            //document.getElementById('fill').textContent = `Fill: ${fill.join(', ')}`;

            // Clear previous filler elements
            document.querySelectorAll('.filler').forEach(e => e.remove());

            // Add filler elements to fill the rows
            rows.forEach((row, rowIndex) => {
                const fillCount = fill[rowIndex];
                if (fillCount > 0) {
                    const lastItem = row[row.length - 1];
                    for (let i = 0; i < fillCount; i++) {
                        const filler = document.createElement('div');
                        filler.classList.add('filler');
                        const svg = document.createElement('img');
                        svg.src = 'fillercube.svg';
                        svg.style.width = '40%';
                        filler.appendChild(svg);
                        lastItem.parentNode.appendChild(filler);
                    }
                }
            });
        }

        // Retrieve all <img> elements with class "content"
        const contentImages = document.querySelectorAll('.content');

        // Loop through each <img> element and add event handlers
        contentImages.forEach(function(image) {
            image.onmouseover = function() {
                this.style.transform = 'scale(105%) rotate(0.5deg)';
            };

            image.onmouseout = function() {
                this.style.transform = 'scale(100%) rotate(0deg)';
            };

        });

        // Get references to the necessary elements
        const openButtons = document.querySelectorAll('.open');
        const popupContainer = document.getElementById('popup-container');
        const popupIframe = document.getElementById('popup-iframe');
        const popupName = document.getElementById('name');
        const popupInfo = document.getElementById('info-text')

        // Loop through each <button> element and add event handler
        openButtons.forEach(function(button) {
            button.onmouseover = function() {
                this.previousElementSibling.style.transform = 'scale(105%) rotate(0.5deg)';
            };

            button.onmouseout = function() {
                this.previousElementSibling.style.transform = 'scale(101%) rotate(0deg)';
            };

            button.addEventListener('click', () => {
    // 1. Reset the filter immediately so the NEW load is hidden
    popupIframe.classList.remove('ready');

    popupIframe.src = button.dataset.link; 
    popupName.innerHTML = button.dataset.name; 
    popupInfo.innerHTML = button.dataset.text; 

    popupContainer.style.visibility = 'visible';
    document.body.style.overflow = "hidden";

    // 2. Wait for the iframe to load, then wait 1.5s for the 3D engine
    popupIframe.onload = () => {
        if (popupIframe.src !== "about:blank") {
            setTimeout(() => {
                popupIframe.classList.add('ready');
            }, 2700); // The "anti-blink" buffer
        }
    };
});

        });

        // Get the close button and the popup container
        const closeButton = document.getElementById('close');

        // Add a click event listener to the close button
        closeButton.addEventListener('click', function() {
    popupContainer.style.visibility = 'hidden';
    document.body.style.overflow = "auto";

    // Reset everything for the next click
    popupIframe.classList.remove('ready');
    popupIframe.src = "about:blank"; 
});



class AnimatedCube extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({ mode: 'open' });
    }

    connectedCallback() {
        this.shadowRoot.innerHTML = `
        <style>
            :host {
                display: inline-block;
                width: 100%;
                height: 100%;
                cursor: pointer;
            }
            .container {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .scene { position: absolute; width: 0; height: 0; visibility: hidden; }
            .isometric-space { 
                transform-style: preserve-3d; 
                transform: rotateX(-35.264deg) rotateY(45deg); 
            }
            .cube-proxy { 
                transform-style: preserve-3d; 
                animation: loop90 2s infinite linear; 
            }
            @keyframes loop90 { 
                from { transform: rotateY(-45deg); } 
                to { transform: rotateY(-135deg); } 
            }
            #cube-svg { 
                width: 100%; 
                height: 100%; 
                max-width: 60px; 
                overflow: visible; 
            }
            .face { 
                fill: none; 
                stroke: rgb(133, 108, 76); 
                stroke-width: 22; 
                stroke-linejoin: round;
                /* Transition removed to ensure instant color change */
            }

            :host-context(.open:hover) .face {
                stroke: #ffffff !important;
            }

            :host(:hover) .face {
                stroke: #ffffff !important;
            }

        </style>
        <div class="container">
            <div class="scene">
                <div class="isometric-space">
                    <div class="cube-proxy">
                        <div class="vertex" id="v1" style="transform: translate3d(-100px, -100px, 100px)"></div>
                        <div class="vertex" id="v2" style="transform: translate3d(100px, -100px, 100px)"></div>
                        <div class="vertex" id="v3" style="transform: translate3d(100px, 100px, 100px)"></div>
                        <div class="vertex" id="v4" style="transform: translate3d(-100px, 100px, 100px)"></div>
                        <div class="vertex" id="v5" style="transform: translate3d(-100px, -100px, -100px)"></div>
                        <div class="vertex" id="v6" style="transform: translate3d(100px, -100px, -100px)"></div>
                        <div class="vertex" id="v7" style="transform: translate3d(100px, 100px, -100px)"></div>
                        <div class="vertex" id="v8" style="transform: translate3d(-100px, 100px, -100px)"></div>
                    </div>
                </div>
            </div>
            <svg id="cube-svg" viewBox="0 0 400 400">
                <path id="side-left" class="face" />
                <path id="side-right" class="face" />
                <path id="top-face" class="face" />
            </svg>
        </div>`;
        
        this.update();
    }

    update() {
        const svg = this.shadowRoot.getElementById('cube-svg');
        const faces = {
            top:   { el: this.shadowRoot.getElementById('top-face'),   pts: ['v5','v6','v2','v1'] },
            sideRight: { el: this.shadowRoot.getElementById('side-right'), pts: ['v2','v6','v7','v3'] },
            sideLeft:  { el: this.shadowRoot.getElementById('side-left'),  pts: ['v1','v2','v3','v4'] }
        };

        const animate = () => {
            const svgRect = svg.getBoundingClientRect();
            if (svgRect.width === 0) {
                requestAnimationFrame(animate);
                return;
            }
            
            const centerX = svgRect.left + svgRect.width / 2;
            const centerY = svgRect.top + svgRect.height / 2;

            for (let key in faces) {
                const face = faces[key];
                const coords = face.pts.map(id => {
                    const el = this.shadowRoot.getElementById(id);
                    const rect = el.getBoundingClientRect();
                    return `${rect.left - centerX + 200},${rect.top - centerY + 200}`;
                });
                face.el.setAttribute('d', `M ${coords[0]} L ${coords[1]} L ${coords[2]} L ${coords[3]} Z`);
            }
            requestAnimationFrame(animate);
        };
        animate();
    }
}
customElements.define('animated-cube', AnimatedCube);
</script>
